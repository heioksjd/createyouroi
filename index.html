,.45)'/%3E%3Ccircle cx='65.0' cy='75.0' r='4.2' fill='%23C2F0CC'/%3E%3Ccircle cx='63.7' cy='73.5' r='1.4' fill='rgba(255,255,255,.45)'/%3E%3Ccircle cx='75.0' cy='75.0' r='4.2' fill='%23C2F0CC'/%3E%3Ccircle cx='73.7' cy='73.5' r='1.4' fill='rgba(255,255,255,.45)'/%3E%3C/svg%3E">
<title>敖董的拼豆工坊 · 在线画图纸</title>
<style>
  :root {
    --ac:#2E9E68; --ac-d:#278A5B; --ac-soft:#EDF8F1;
    --bg:#F2F3F6; --panel:#FFFFFF; --bd:#E5E7EC; --bd2:#D3D7DD;
    --tx:#2B2F36; --tx2:#6B7280; --tx3:#9AA0A8;
    --shadow:0 1px 2px rgba(20,24,34,.05), 0 4px 16px rgba(20,24,34,.07);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--tx); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  button { border:1px solid var(--bd); background:#fff; border-radius:10px; padding:8px 14px; font-size:13px; cursor:pointer; color:var(--tx); transition:all .15s ease; }
  button:hover { border-color:var(--ac); color:var(--ac); background:var(--ac-soft); }
  button:active { transform:scale(.96); }
  button.primary { background:linear-gradient(135deg,#2E9E68,#27925E); border-color:transparent; color:#fff; box-shadow:0 2px 8px rgba(46,158,104,.35); }
  button.primary:hover { filter:brightness(1.07); color:#fff; }
  header { background:var(--panel); border-bottom:1px solid var(--bd); padding:10px 16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  header h1 { font-size:17px; font-weight:700; margin-right:6px; display:flex; align-items:center; gap:8px; color:#971937; }   /* F7 酒红 */
  header h1 .logo { width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; vertical-align:-7px; margin-right:2px; filter:drop-shadow(0 2px 3px rgba(141,97,76,.25)); }
  header h1 .logo svg { width:100%; height:100%; }
  header h1 span { color:inherit; }
  .mOnly { display:none !important; }
  main { flex:1; display:flex; overflow:hidden; }
  /* 调色板 */
  #palette { width:212px; background:var(--panel); border-right:1px solid var(--bd); display:flex; flex-direction:column; }
  #palette .cur { padding:12px; border-bottom:1px solid var(--bd); display:flex; align-items:center; gap:10px; background:linear-gradient(180deg,#FFF, #F5FBF7); }
  #curSwatch { width:38px; height:38px; border-radius:11px; border:1px solid rgba(0,0,0,.12); box-shadow:inset 0 -6px 12px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.08); }
  #curCode { font-size:15px; font-weight:700; letter-spacing:.5px; }
  #curHex { font-size:11px; color:var(--tx3); }
  #palSearch { margin:10px; padding:7px 12px; border:1px solid var(--bd); border-radius:10px; font-size:12px; outline:none; background:#F7F8FA; transition:.15s; }
  #palSearch:focus { border-color:var(--ac); background:#fff; box-shadow:0 0 0 3px rgba(46,158,104,.12); }
  #palGrid { flex:1; overflow-y:auto; padding:4px 10px 14px; display:grid; grid-template-columns:repeat(5,1fr); gap:6px; align-content:start; }
  .chip { aspect-ratio:1; border-radius:8px; border:1px solid rgba(0,0,0,.10); cursor:pointer; position:relative; transition:transform .12s ease, box-shadow .12s ease; }
  .chip:hover { transform:scale(1.14); z-index:2; box-shadow:0 3px 8px rgba(0,0,0,.18); }
  .chip.sel { outline:2.5px solid var(--ac); outline-offset:1.5px; }
  .chip b { position:absolute; inset:auto 0 -1px; text-align:center; font-size:9px; font-weight:400; pointer-events:none; }
  /* 画布区 */
  #stage { flex:1; overflow:auto; padding:20px; }
  #board { display:grid; gap:1px; background:#D9DCE1; border:2px solid #C7CBD1; border-radius:6px; width:max-content; box-shadow:0 3px 14px rgba(20,24,34,.09); user-select:none; touch-action:none; overflow:hidden; }
  .cell { background:#fff; position:relative; cursor:crosshair; }
  .cell i { position:absolute; inset:8%; border-radius:50%; display:block; box-shadow:inset 0 -2px 3px rgba(0,0,0,.18), inset 0 2px 2px rgba(255,255,255,.25); }
  .cell span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9px; pointer-events:none; }
  #status { padding:8px 18px; background:var(--panel); border-top:1px solid var(--bd); font-size:12px; color:var(--tx2); display:flex; gap:18px; flex-wrap:wrap; align-items:center; }
  #status span b { color:var(--ac); font-weight:600; }
  /* 侧栏设置 */
  #side { width:196px; background:var(--panel); border-left:1px solid var(--bd); padding:14px 12px; display:flex; flex-direction:column; gap:14px; overflow-y:auto; }
  #side h3 { font-size:11px; color:var(--tx3); font-weight:600; letter-spacing:.06em; margin-bottom:5px; text-transform:uppercase; }
  .row { display:flex; gap:6px; }
  .row input { width:56px; padding:6px 9px; border:1px solid var(--bd); border-radius:9px; font-size:13px; outline:none; transition:.15s; background:#F7F8FA; }
  .row input:focus { border-color:var(--ac); background:#fff; box-shadow:0 0 0 3px rgba(46,158,104,.12); }
  .tools { display:flex; flex-direction:column; gap:6px; }
  .tools button { text-align:left; border-radius:10px; }
  .tools button.on { border-color:var(--ac); color:var(--ac); background:var(--ac-soft); font-weight:600; box-shadow:inset 0 0 0 1px var(--ac); }
  #works { display:flex; flex-direction:column; gap:6px; }
  .witem { display:flex; align-items:center; gap:6px; font-size:12px; background:#F7F8FA; border:1px solid var(--bd); border-radius:9px; padding:5px 7px; }
  .witem button { padding:3px 8px; font-size:11px; border-radius:7px; }
  .witem .wname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; font-weight:500; }
  /* 弹窗 */
  .mask { position:fixed; inset:0; background:rgba(24,28,38,.42); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:50; }
  .modal { background:#fff; border-radius:16px; padding:22px; width:min(560px,92vw); max-height:84vh; overflow-y:auto; box-shadow:0 20px 60px rgba(20,24,34,.25); animation:pop .22s cubic-bezier(.34,1.4,.64,1); }
  @keyframes pop { from{ transform:scale(.92); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .modal h2 { font-size:16px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .modal h2::before { content:''; width:4px; height:16px; border-radius:2px; background:linear-gradient(180deg,#2E9E68,#5FBF8E); }
  .modal textarea { width:100%; height:200px; border:1px solid var(--bd); border-radius:10px; padding:10px; font-size:12px; font-family:Consolas,monospace; resize:vertical; outline:none; background:#F7F8FA; }
  .modal textarea:focus { border-color:var(--ac); background:#fff; }
  .modal .tip { font-size:12px; color:var(--tx2); margin:8px 0 12px; }
  .modal .btns { display:flex; gap:8px; justify-content:flex-end; }
  #billList { font-size:13px; }
  #billList .brow { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed #EEE; }
  #billList .bsw { width:22px; height:22px; border-radius:50%; border:1px solid rgba(0,0,0,.12); box-shadow:inset 0 -3px 5px rgba(0,0,0,.1); }
  #billList .bcode { width:48px; font-weight:600; }
  .tpl { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px dashed #EEE; }
  .tgrid { display:grid; gap:0; width:max-content; border-radius:4px; overflow:hidden; }
  .tgrid b { width:6px; height:6px; display:block; }
  #toast { position:fixed; left:50%; top:56px; transform:translateX(-50%); background:rgba(35,39,47,.92); color:#fff; padding:9px 20px; border-radius:22px; font-size:13px; opacity:0; transition:.25s; pointer-events:none; z-index:99; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  /* 手机端：两栏变抽屉 */
  @media (max-width:760px){
    #palette, #side { position:fixed; top:0; bottom:0; z-index:40; width:min(240px,78vw); transition:transform .25s ease; box-shadow:0 10px 40px rgba(0,0,0,.2); }
    #palette { left:0; transform:translateX(-102%); }
    #side { right:0; transform:translateX(102%); }
    body.showPal #palette { transform:none; }
    body.showSide #side { transform:none; }
    .mOnly { display:inline-flex !important; }
    header button:not(.mOnly):not(.primary) { padding:8px 10px; font-size:12px; }
    header h1 { font-size:16px; }
  }
</style>
</head>

  <button class="mOnly" onclick="document.body.classList.toggle('showPal')" title="调色板">🎨</button>
  <button class="mOnly" onclick="document.body.classList.toggle('showSide')" title="设置">⚙</button>
  <button class="primary" onclick="copyCode()">复制编码</button>
  <button onclick="showImport()">导入编码</button>
  <button onclick="undo()" title="Ctrl+Z">↶ 撤销</button>
  <button onclick="redo()" title="Ctrl+Y">↷ 重做</button>
  <button onclick="showTpl()">示例模板</button>
  <button onclick="exportPattern()" title="正面 + 镜像图纸（带色号、每 5 格分隔线）">输出图纸</button>
  <button onclick="exportPreview()" title="圆点预览图（不标色号）">输出预览图</button>
  <button onclick="showBill()">用料清单</button>
  <button onclick="showBoard()" title="访客留言（GitHub Discussions）">留言板</button>
  <button onclick="saveWork()">保存作品</button>
  <span id="copyHint" style="font-size:12px;color:#3B6D11;display:none">已复制 ✓</span>

<main>
  <div id="palette">
    <div class="cur">
      <div id="curSwatch"></div>
      <div><div id="curCode">A1</div><div id="curHex">#F9F0CD</div></div>
    </div>
    <input id="palSearch" placeholder="搜索色号，如 A5 / F11">
    <div id="palGrid"></div>
  </div>
  <div id="stage"><div id="board"></div></div>
  <div id="side">
    <div>
      <h3>画布尺寸（宽 × 高）</h3>
      <div class="row">
        <input id="inW" type="number" min="5" max="120" value="52">
        <input id="inH" type="number" min="5" max="120" value="52">
        <button onclick="applyResize()">调整</button>
      </div>
    </div>
    <div>
      <h3>格子大小</h3>
      <div class="row">
        <input id="inCell" type="number" min="8" max="40" value="22">
        <button onclick="applyResize()">应用</button>
      </div>
    </div>
    <div>
      <h3>工具</h3>
      <div class="tools">
        <button id="t-pen" class="on" onclick="setTool('pen')">✏ 画笔</button>
        <button id="t-era" onclick="setTool('era')">◻ 橡皮</button>
        <button id="t-line" onclick="setTool('line')">╱ 直线</button>
        <button id="t-fill" onclick="setTool('fill')">▨ 填充</button>
        <button id="t-pic" onclick="setTool('pic')">◉ 吸色</button>
      </div>
    </div>
    <div>
      <h3>小狼底图</h3>
      <label style="font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="wolfOn" checked onchange="toggleWolf()"> 显示小狼崽底图
      </label>
      <button style="width:100%;margin-top:6px" onclick="stampWolf()">并入画布（转正为珠子）</button>
    </div>
    <div>
      <h3>作品（本机保存）</h3>
      <div class="row"><input id="wname" placeholder="作品名称" style="flex:1"></div>
      <button style="width:100%" onclick="saveWork()">保存当前</button>
      <div id="works"></div>
    </div>
    <button onclick="clearAll()" style="color:#A32D2D">清空画布</button>
  </div>
</main>
<div id="status">
  <span id="stDim"></span><span id="stCount"></span><span id="stColors"></span>
  <span style="color:#AAA">提示：按住拖动可连续涂色；Ctrl+Z 撤销 / Ctrl+Y 重做；编码可直接粘贴到微信群分享</span>
</div>

<div class="mask" id="mResume">
  <div class="modal">
    <h2>欢迎回来</h2>
    <div class="tip" id="resumeInfo" style="margin-top:-4px"></div>
    <div class="btns">
      <button onclick="freshStart()">新建 52×52</button>
      <button class="primary" onclick="resumeWork()">恢复上次作品</button>
    </div>
  </div>
</div>
<div class="mask" id="mImport">
  <div class="modal">
    <h2>导入编码</h2>
    <textarea id="impText" placeholder="粘贴图纸编码，例如：&#10;【某某画板 10x8】&#10;F11 F11 . . F11&#10;F11 . F7 F7 ."></textarea>
    <div class="tip">支持粘贴本站复制的编码；自动识别尺寸并载入，多余空白忽略。</div>
    <div class="btns">
      <button onclick="hide('mImport')">取消</button>
      <button class="primary" onclick="doImport()">载入画布</button>
    </div>
  </div>
</div>
<div class="mask" id="mTpl">
  <div class="modal">
    <h2>示例模板</h2>
    <div class="tip">点击「打开」把模板载入画布（当前画布内容会被替换，建议先保存）。</div>
    <div id="tplList"></div>
    <div class="btns" style="margin-top:14px"><button class="primary" onclick="hide('mTpl')">关闭</button></div>
  </div>
</div>
<div class="mask" id="mBill">
  <div class="modal">
    <h2>用料清单</h2>
    <div id="billList"></div>
    <div class="btns" style="margin-top:14px"><button class="primary" onclick="hide('mBill')">关闭</button></div>
  </div>
</div>
<div class="mask" id="mBoard">
  <div class="modal">
    <h2>留言板</h2>
    <div class="tip">登录 GitHub 后即可留言、贴图分享作品；留言保存在本项目的 Discussions 中，公开可见。</div>
    <div id="giscusBox" style="min-height:120px">
      <div class="tip" id="giscusHint">留言板即将开放，敬请期待。</div>
    </div>
    <div class="btns" style="margin-top:14px"><button class="primary" onclick="hide('mBoard')">关闭</button></div>
  </div>
</div>
<div id="toast"></div>

"E15":"#F2CFD0","E16":"#FFECDE","E17":"#FFE2EA","E18":"#FFC9D6","E19":"#FFD2E7","E20":"#D8C7D1","E21":"#BD9DA1","E22":"#CC78A7","E23":"#937A8D","E24":"#F6E4F9","F1":"#FD957B","F2":"#FC3D45","F3":"#F74941","F4":"#FC283C","F5":"#D80127","F6":"#B0443D","F7":"#971937","F8":"#BC0127","F9":"#E2677A","F10":"#A74D22","F11":"#6F201F","F12":"#FD4D6A","F13":"#DD422F","F14":"#FFA9AD","F15":"#C80020","F16":"#FFD9C8","F17":"#F79B71","F18":"#D37C46","F19":"#C1444A","F20":"#CD9391","F21":"#F4B1B4","F22":"#FFD0CB","F23":"#F57E66","F24":"#FCC1C4","F25":"#E54B4F","G1":"#FFE2CE","G2":"#FFCAAA","G3":"#F4C3A5","G4":"#E1B383","G5":"#ED9435","G6":"#F59734","G7":"#9D5B3E","G8":"#592A21","G9":"#E6B483","G10":"#C88135","G11":"#E0C593","G12":"#EBBB83","G13":"#B7714A","G14":"#8D614C","G15":"#FCF9E0","G16":"#F2D9BA","G17":"#56403C","G18":"#FFE4CC","G19":"#E1943A","G20":"#A94023","G21":"#CB8E77","H1":"#E2E2E2","H2":"#FFFFFF","H3":"#B3B3B3","H4":"#868686","H5":"#474747","H6":"#2C2C2C","H7":"#000000","H8":"#E7D6DB","H9":"#E4E7E3","H10":"#EEE9EA","H11":"#CECDD5","H12":"#FFF5ED","H13":"#F3E1C9","H14":"#CFD7D3","H15":"#98A6A8","H16":"#3B2F23","H17":"#F1EDED","H18":"#FFFDF0","H19":"#F6EFE2","H20":"#949FA3","H21":"#F7F3E4","H22":"#CACAD5","H23":"#9A9D94","M1":"#BCC6B8","M2":"#8AA385","M3":"#697D80","M4":"#DACEBE","M5":"#D0CCAA","M6":"#B0A782","M7":"#B4A497","M8":"#B38281","M9":"#A58767","M10":"#C5B1BC","M11":"#9F7494","M12":"#644749","M13":"#D19066","M14":"#C77361","M15":"#757D7B"};
const CODES = Object.keys(PAL);
const HEX = Object.values(PAL);
const LUM = {}; CODES.forEach((c,i)=>{ const h=HEX[i]; const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); LUM[c]=0.299*r+0.587*g+0.114*b; });

let W=52, H=52, CELL=22;
let grid = Array.from({length:H},()=>Array(W).fill(null));
let cur = 'A1', tool = 'pen';
let painting = false;
let wolfOn = true;   // 默认显示底图，进入页面即开启
const WOLF = [[null,"F11","F11",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,"F11","F11",null],[null,"F11","F7","F11","F11",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,"F11","F11","F7","F11",null],["F11","F7","F7","F7","F7","F11",null,null,null,null,null,null,null,null,null,null,null,null,null,"F11","F7","F7","F7","F7","F11"],["F11","F7","F7","F7","F7","F7","F11",null,null,"F11","F11","F11","F11","F7","F7","F7",null,null,"F11","F7","F7","F7","F7","F7","F11"],["F11","F7","F7","F20","F11","F7","F7","F7","F11","F7","F7","F7","F7","F11","F11","F11","F7","F7","F7","F7","F11","F20","F7","F7","F11"],[null,"F11","F7","F20","F20","F11","F7","F7","F7","F7","F7","F11","F11","F7","F7","F11","F7","F7","F7","F11","F20","F20","F7","F11",null],[null,"F11","F7","F20","F20","F20","F11","F7","F7","F7","F7","F7","F7","F7","F7","F11","F11","F11","F11","F20","F20","F20","F7","F11",null],[null,"F11","F7","F20","F20","F11","F7","F7","F11","F7","F7","F7","F7","F7","F11","F7","F7","F7","F7","F11","F20","F20","F7","F11",null],["F11","F7","F7","F20","F11","F7","F7","F11","F11","F11","F11","F11","F7","F7","F7","F7","F7","F7","F11","F7","F11","F20","F7","F7","F11"],[null,"F11","F7","F11","F7","F7","F11","F7","F7","F7","F11","F7","F11","F11","F11","F7","F7","F7","F7","F7","F7","F11","F7","F11",null],["F11","F11","F7","F7","F7","F7","F11","F7","F7","F7","F11","F11","F7","F7","F7","F11","F11","F7","F11","F7","F7","F7","F7","F11","F11"],["F11","F7","F7","F7","F7","F7","F11","F7","F7","F7","F11","F7","F7","F7","F7","F7","F7","F11","F7","F7","F7","F7","F7","F7","F11"],["F11","F7","F7","F7","F7","F7","F11","F11","F7","F7","F11","F7","F7","F11","F11","F11","F11","F7","F7","F7","F11","F7","F7","F7","F11"],[null,"F11","F7","F7","F7","F11","F7","F11","F11","F11","F11","F7","F11","F7","F11","F11","F11","F11","F7","F7","F7","F11","F7","F11",null],["F11","F7","F7","F7","F11","F11","F11","E16","E16","E16","E16","F11","F11","F11","E16","E16","E16","E16","F11","F7","F11","F7","F7","F7","F11"],["F11","F7","F7","F11","F7","F7","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","F7","F7","F7","F7","F7","F11"],[null,"F11","F7","F7","F7","F11","E16","E16","E16","E16","F11","E16","E16","E16","F11","E16","E16","E16","E16","F11","F7","F7","F7","F11",null],[null,"F11","F7","F7","F7","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","F7","F7","F7","F11",null],[null,null,"F7","F11","F11","E16","E16","G12","G12","A5","E16","E16","E16","E16","E16","A5","G12","G12","E16","E16","F11","F11","F7",null,null],[null,"F11","E16","E16","E16","E16","E16","A5","A5","H2","E16","E16","E16","E16","E16","H2","A5","A5","E16","E16","E16","E16","E16","F11",null],[null,"F11","E16","E16","F11","E16","F24","F24","A15","A5","E16","E16","E16","E16","E16","A5","A15","F24","F24","E16","F11","E16","E16","F11",null],[null,null,"F11","E16","F11","F24","F24","F24","F24","E16","E16","E16","E16","E16","E16","E16","F24","F24","F24","F24","F11","E16","F11",null,null],[null,null,null,"F11","E16","F24","F24","F24","F24","E16","E16","E16","E16","M14","E16","E16","F24","F24","F24","F24","E16","F11",null,null,null],[null,null,null,"F11","E16","E16","F24","F24","E16","E16","E16","M14","M14","E16","E16","E16","E16","F24","F24","E16","E16","F11",null,null,null],[null,null,null,null,"F11","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","F11",null,null,null,null],[null,null,null,null,null,"F11","F11","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","E16","F11","F11",null,null,null,null,null],[null,null,null,null,null,null,null,null,"F11","F11","F11","F11","F11","F11","F11","F11","F11",null,null,null,null,null,null,null,null]];
const WH = WOLF.length, WW = WOLF[0].length;
function wolfOff(){ return [Math.max(0,Math.floor((H-WH)/2)), Math.max(0,Math.floor((W-WW)/2))]; }
function wolfAt(r,c){
  if(!wolfOn) return null;
  const [oy,ox] = wolfOff();
  const wr=r-oy, wc=c-ox;
  return (wr>=0 && wr<WH && wc>=0 && wc<WW) ? WOLF[wr][wc] : null;
}
function mixWhite(hex, t){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const m=v=>Math.round(v+(255-v)*t).toString(16).padStart(2,'0');
  return '#'+m(r)+m(g)+m(b);
}

const $ = id => document.getElementById(id);
const board = $('board');

/* ---------- 调色板 ---------- */
function buildPalette(filter){
  const g = $('palGrid'); g.innerHTML='';
  CODES.forEach((c,i)=>{
    if(filter && !c.toLowerCase().includes(filter)) return;
    const d = document.createElement('div');
    d.className = 'chip' + (c===cur?' sel':'');
    d.style.background = HEX[i];
    d.title = c+' '+HEX[i];
    d.innerHTML = '<b style="color:'+(LUM[c]>150?'#444':'#eee')+'">'+c+'</b>';
    d.onclick = ()=>{ cur=c; tool='pen'; setTool('pen'); $('curCode').textContent=c; $('curHex').textContent=PAL[c]; $('curSwatch').style.background=PAL[c]; buildPalette($('palSearch').value.trim().toLowerCase()); };
    g.appendChild(d);
  });
}
$('palSearch').oninput = e => buildPalette(e.target.value.trim().toLowerCase());

/* ---------- 画布 ---------- */
let lastPaint = null;
/* ---------- 撤销/重做 ---------- */
let undoStack=[], redoStack=[];
function snap(){ return JSON.stringify(grid); }
function pushUndo(){ undoStack.push(snap()); if(undoStack.length>100) undoStack.shift(); redoStack.length=0; }
function applySnap(s){
  grid = JSON.parse(s).map(r=>r.map(v=>v||null));
  W = grid[0].length; H = grid.length;
  $('inW').value=W; $('inH').value=H;
  buildBoard(); persist();
}
function undo(){ if(!undoStack.length){ toast('没有可撤销的操作'); return; } redoStack.push(snap()); applySnap(undoStack.pop()); }
function redo(){ if(!redoStack.length){ toast('没有可重做的操作'); return; } undoStack.push(snap()); applySnap(redoStack.pop()); }
document.addEventListener('keydown', e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  const k = e.key.toLowerCase();
  if(k==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if(k==='y' || (k==='z' && e.shiftKey)){ e.preventDefault(); redo(); }
});

/* 直线工具状态 */
let lineStart=null, prevLine=[];
function lineCells(r0,c0,r1,c1){
  const cells=[], dx=Math.abs(c1-c0), dy=Math.abs(r1-r0);
  const sx=c0<c1?1:-1, sy=r0<r1?1:-1;
  let err=dx-dy, r=r0, c=c0;
  for(;;){
    cells.push([r,c]);
    if(r===r1 && c===c1) break;
    const e2=2*err;
    if(e2>-dy){ err-=dy; c+=sx; }
    if(e2<dx){ err+=dx; r+=sy; }
  }
  return cells;
}
function clearPreview(){
  prevLine.forEach(([r,c])=>{ const el=cellEl(r,c); if(el) paintCell(el, grid[r][c], r, c); });
  prevLine=[];
}

// 事件委托：整块画布只挂 3 个监听器（替代每格 2 个 × 2704 格）
board.addEventListener('pointerdown', e=>{
  const el = e.target.closest('.cell'); if(!el || e.button!==0) return;
  e.preventDefault();
  const r=+el.dataset.r, c=+el.dataset.c;
  if(tool==='line'){ pushUndo(); lineStart=[r,c]; prevLine=[]; painting=true; lastPaint=el; paintLinePreview(r,c); return; }
  if(tool==='fill'){ doFill(r,c); return; }
  if(tool==='pen'||tool==='era'){ strokePushed=false; }
  painting=true; lastPaint=el;
  act(r, c, el);
});
board.addEventListener('pointermove', e=>{
  if(!painting) return;
  if(!(e.buttons & 1)){ painting=false; lastPaint=null; return; }
  const el = e.target.closest('.cell');
  if(!el || el===lastPaint) return;   // 同一格内移动不触发，避免重复渲染
  lastPaint=el;
  const r=+el.dataset.r, c=+el.dataset.c;
  if(tool==='line'){ paintLinePreview(r,c); return; }
  act(r, c, el);
});
window.addEventListener('pointerup', ()=>{
  if(tool==='line' && painting){ commitLine(); }
  painting=false; lastPaint=null; if(dirty){ status(); persist(); dirty=false; }
});
// 兜底：切窗口/指针离开页面时强制结束连续上色
window.addEventListener('blur', ()=>{ painting=false; lastPaint=null; });
document.addEventListener('pointerleave', ()=>{ painting=false; lastPaint=null; });

function paintLinePreview(r,c){
  clearPreview();
  lineCells(lineStart[0], lineStart[1], r, c).forEach(([rr,cc])=>{
    const el=cellEl(rr,cc); if(!el) return;
    prevLine.push([rr,cc]);
    paintCell(el, cur, rr, cc);
  });
  dirty=true;
}
function commitLine(){
  const end = prevLine.length ? prevLine[prevLine.length-1] : lineStart;
  clearPreview();
  lineCells(lineStart[0], lineStart[1], end[0], end[1]).forEach(([rr,cc])=>{
    grid[rr][cc]=cur; paintCell(cellEl(rr,cc), cur, rr, cc);
  });
  lineStart=null; dirty=true;
}
function doFill(r,c){
  const target = grid[r][c];
  if(target === cur){ toast('该区域已经是当前颜色'); return; }
  pushUndo();
  const st=[[r,c]], seen=new Set([r*W+c]);
  while(st.length){
    const [y,x]=st.pop(); grid[y][x]=cur;
    for(const [ny,nx] of [[y+1,x],[y-1,x],[y,x+1],[y,x-1]]){
      if(ny>=0&&ny<H&&nx>=0&&nx<W&&!seen.has(ny*W+nx)&&grid[ny][nx]===target){ seen.add(ny*W+nx); st.push([ny,nx]); }
    }
  }
  buildBoard(); persist();
  toast('已填充');
}

function buildBoard(){
  board.innerHTML='';
  board.style.gridTemplateColumns = 'repeat('+W+', '+CELL+'px)';
  board.style.gridAutoRows = CELL+'px';
  const frag = document.createDocumentFragment();
  for(let r=0;r<H;r++) for(let c=0;c<W;c++){
    const d = document.createElement('div');
    d.className='cell'; d.dataset.r=r; d.dataset.c=c;
    // 常驻子节点：高光 i + 色号 span，后续只改样式/文本，不再 innerHTML 重建
    const i = document.createElement('i');
    const s = document.createElement('span');
    d.appendChild(i); d.appendChild(s);
    paintCell(d, grid[r][c], r, c);
    frag.appendChild(d);
  }
  board.appendChild(frag);
  status();
}
function cellEl(r,c){ return board.children[r*W+c]; }
function paintCell(el, code, r, c){
  const i = el.firstChild, s = el.lastChild;
  const w = wolfAt(r, c);
  if(!code && w){
    el.style.background = mixWhite(PAL[w], 0.6);
    i.style.display='none';
    s.style.display = CELL>=14 ? 'flex' : 'none';
    s.textContent = w; s.style.color = 'rgba(0,0,0,.35)';
    return;
  }
  if(!code){
    el.style.background='#fff'; i.style.display='none'; s.style.display='none'; s.textContent='';
    return;
  }
  el.style.background = PAL[code];
  i.style.display='block';
  s.style.display = CELL>=14 ? 'flex' : 'none';
  s.textContent = CELL>=14 ? code : '';
  s.style.color = LUM[code]>150 ? 'rgba(0,0,0,.65)' : 'rgba(255,255,255,.9)';
}
function act(r,c,el){
  if(tool==='pen'||tool==='era'){
    if(!strokePushed){ pushUndo(); strokePushed=true; }   // 一笔只记一次快照，空点不产生无效撤销
    if(tool==='pen'){ grid[r][c]=cur; paintCell(el,cur,r,c); }
    else { grid[r][c]=null; paintCell(el,null,r,c); }
  }
  else { const v=grid[r][c]; if(v){ cur=v; $('curCode').textContent=v; $('curHex').textContent=PAL[v]; $('curSwatch').style.background=PAL[v]; } }
  dirty=true;
}
let dirty=false, strokePushed=false;

function status(){
  $('stDim').innerHTML = W+' × '+H+' 格';
  const cnt = {};
  grid.forEach(row=>row.forEach(v=>{ if(v) cnt[v]=(cnt[v]||0)+1; }));
  const total = Object.values(cnt).reduce((a,b)=>a+b,0);
  $('stCount').innerHTML = '<b>'+total+'</b> 颗';
  $('stColors').innerHTML = '<b>'+Object.keys(cnt).length+'</b> 种颜色';
}

/* ---------- 工具/尺寸 ---------- */
function setTool(t){
  tool=t;
  ['pen','era','line','fill','pic'].forEach(x=>$('t-'+x).classList.toggle('on', x===t));
  if(t==='line' && lineStart){ clearPreview(); lineStart=null; }
}
function applyResize(){
  pushUndo();
  const nw = Math.max(5, Math.min(120, +$('inW').value||W));
  const nh = Math.max(5, Math.min(120, +$('inH').value||H));
  const ns = Math.max(8, Math.min(40, +$('inCell').value||CELL));
  W=nw; H=nh; CELL=ns;
  grid = grid.slice(0,H).map(r=>r.slice(0,W));
  while(grid.length<H) grid.push(Array(W).fill(null));
  grid = grid.map(r=>{ while(r.length<W) r.push(null); return r.slice(0,W); });
  $('inW').value=W; $('inH').value=H; $('inCell').value=CELL;
  buildBoard(); persist();
}
function clearAll(){
  if(!confirm('确定清空整块画布？')) return;
  pushUndo();
  grid = Array.from({length:H},()=>Array(W).fill(null));
  buildBoard(); persist();
}

/* ---------- 小狼底图 ---------- */
function toggleWolf(){
  wolfOn = $('wolfOn').checked;
  try{ localStorage.setItem('pb_wolf', wolfOn?'1':'0'); }catch(e){}   // 记住选择
  if(wolfOn && (W < 8 || H < 8)){ toast('画布太小，建议至少 25×27 再开底图'); }
  buildBoard();
  toast(wolfOn ? '小狼底图已显示，直接在上面涂色即可' : '底图已关闭');
}
function stampWolf(){
  if(!wolfOn && !$('wolfOn').checked){ toast('请先勾选「显示小狼崽底图」'); return; }
  if(!confirm('把小狼底图的所有珠子并入画布？之后可以逐格修改，但不再与底图联动。')) return;
  pushUndo();
  const [oy,ox] = wolfOff();
  let n = 0;
  for(let r=0;r<WH;r++) for(let c=0;c<WW;c++){
    const v = WOLF[r][c]; if(!v) continue;
    const gr = oy+r, gc = ox+c;
    if(gr<H && gc<W && !grid[gr][gc]){ grid[gr][gc]=v; n++; }
  }
  wolfOn = false; $('wolfOn').checked = false;
  try{ localStorage.setItem('pb_wolf','0'); }catch(e){}
  buildBoard(); persist();
  toast('已并入 '+n+' 颗底图珠子');
}

/* ---------- 编码 ---------- */
function genCode(){
  return grid.map(row=>row.map(v=>v||'.').join(' ')).join('\n');
}
function copyCode(){
  const text = '【敖董的拼豆工坊 '+W+'x'+H+'】\n'+genCode();
  const done = ()=>{ const h=$('copyHint'); h.style.display='inline'; setTimeout(()=>h.style.display='none',1500); toast('编码已复制，可直接粘贴分享'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea'); ta.value=text;
  ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}
const TOK = /^([A-Z]\d{1,2}|\.)$/i;
function showImport(){ $('impText').value=''; show('mImport'); $('impText').focus(); }
function doImport(){
  const raw = $('impText').value.replace(/【[^】]*】/g, '');
  const lines = raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let rows=[], skipped=[];
  for(const l of lines){
    const t = l.split(/\s+/);
    if(!TOK.test(t[0])) { skipped.push(t[0]); continue; }
    let i=0; while(i<t.length && TOK.test(t[i])) i++;
    rows.push(t.slice(0,i));
  }
  if(!rows.length){ toast('没有识别到有效编码'); return; }
  const w = Math.max(...rows.map(r=>r.length));
  rows = rows.filter(r=>r.length===w || r.length>=Math.ceil(w*0.8));
  pushUndo();
  H = rows.length; W = Math.max(...rows.map(r=>r.length));
  W = Math.max(5,Math.min(120,W)); H = Math.max(5,Math.min(120,H));
  grid = Array.from({length:H},(_,r)=>{
    const src = rows[r]||[];
    return Array.from({length:W},(_,c)=>{
      const v = (src[c]||'.').toUpperCase();
      return (v!=='.' && PAL[v]) ? v : null;
    });
  });
  $('inW').value=W; $('inH').value=H;
  hide('mImport'); buildBoard(); persist();
  toast('已载入 '+W+'×'+H+' 画布'+(skipped.length?'（忽略 '+skipped.length+' 行杂质）':''));
}

/* ---------- 导出 ---------- */
const BRAND='敖董的拼豆工坊 · https://heioksjd.github.io/createyouroi/';

function beadTotal(){ let n=0; for(let r=0;r<H;r++) for(let c=0;c<W;c++) if(grid[r][c]) n++; return n; }
function canvas2d(w,h){
  const cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(w)); cv.height=Math.max(1,Math.round(h));
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,cv.width,cv.height);
  return {cv,ctx};
}
// 每 5 行 / 每 5 列加粗分隔线：画在格子边界，不压格内色号（与离线图纸同口径）
function fiveLines(ctx, ox, oy, s, cols, rows){
  ctx.save();
  ctx.strokeStyle='rgba(72,84,98,.5)'; ctx.lineWidth = s>=16 ? 2 : 1;
  ctx.beginPath();
  for(let c=5;c<cols;c+=5){ const x=Math.round(ox+c*s)+.5; ctx.moveTo(x,oy); ctx.lineTo(x,oy+rows*s); }
  for(let r=5;r<rows;r+=5){ const y=Math.round(oy+r*s)+.5; ctx.moveTo(ox,y); ctx.lineTo(ox+cols*s,y); }
  ctx.stroke(); ctx.restore();
}
// 底部信息栏：站点头像 + 尺寸/豆数 + 网址
function drawFooter(ctx, cv, fy, footH, s){
  ctx.strokeStyle='#E5E7EB'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,fy+.5); ctx.lineTo(cv.width,fy+.5); ctx.stroke();
  const cs=footH*0.82/LOGOPAT.length, lx=14, ly=fy+(footH-cs*LOGOPAT.length)/2;
  for(let r=0;r<LOGOPAT.length;r++) for(let c=0;c<LOGOPAT[r].length;c++){
    const v=LOGOPAT[r][c]; if(!v) continue;
    ctx.beginPath(); ctx.arc(lx+c*cs+cs/2, ly+r*cs+cs/2, cs*0.45, 0, 7);
    ctx.fillStyle=PAL[v]||'#ccc'; ctx.fill();
  }
  ctx.fillStyle='#6B7280'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const fs=Math.max(15, Math.min(26, s*0.95));
  ctx.font='600 '+fs+'px sans-serif';
  ctx.fillText(W+' × '+H+' 格 · '+beadTotal()+' 颗', cv.width/2, fy+footH*0.34);
  ctx.fillStyle='#9CA3AF'; ctx.font=fs+'px sans-serif';
  ctx.fillText(BRAND, cv.width/2, fy+footH*0.72);
}
function downloadCanvas(cv, name){
  const a=document.createElement('a');
  a.download=name; a.href=cv.toDataURL('image/png'); a.click();
}

// ===== 输出图纸：正面 + 镜像，方框色块 + 色号 + 每 5 格分隔线 =====
function buildPatternCanvas(){
  const total=beadTotal();
  let s=Math.floor(2000/Math.max(W,40));
  s=Math.max(10, Math.min(22, s));
  s=Math.max(7, Math.min(s, Math.floor(2900/(H*2))));   // 两联竖向不超高
  const PAD=Math.max(18, Math.round(s*1.2));
  const gridW=W*s, gridH=H*s;
  const titleFs=Math.max(20, Math.round(s*1.2)), subFs=Math.max(12, Math.round(s*0.72));
  const headH=titleFs+subFs+26;
  const labelFs=Math.max(12, Math.round(s*0.78)), labelH=labelFs+12;
  const gap=Math.round(s*1.1);
  const footH=Math.max(52, s*2.4);
  const cvW=PAD*2+gridW;

  // 图例折行预排
  const cnt={}; for(let r=0;r<H;r++) for(let c=0;c<W;c++){ const v=grid[r][c]; if(v) cnt[v]=(cnt[v]||0)+1; }
  const ents=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(k=>({code:k,n:cnt[k]}));
  const lgFs=Math.max(12, Math.round(s*0.86)), chip=Math.round(lgFs*0.95), itemGap=Math.round(lgFs*1.2);
  const mctx=document.createElement('canvas').getContext('2d');
  mctx.font='600 '+lgFs+'px sans-serif';
  const items=ents.map(e=>({e, w:chip+6+mctx.measureText(e.code+' ×'+e.n).width}));
  const maxW=cvW-PAD*2, lines=[]; let cur=[], curW=0;
  items.forEach(it=>{
    const add=(cur.length?itemGap:0)+it.w;
    if(cur.length && curW+add>maxW){ lines.push({items:cur,w:curW}); cur=[it]; curW=it.w; }
    else { cur.push(it); curW+=add; }
  });
  if(cur.length) lines.push({items:cur,w:curW});
  const legendH=lines.length ? lines.length*(lgFs+12)+4 : 0;

  const cvH=PAD+headH+labelH+gridH+gap+labelH+gridH+(legendH?gap+legendH:0)+6+footH;
  const {cv,ctx}=canvas2d(cvW,cvH);

  // 标题
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='#111827'; ctx.font='700 '+titleFs+'px sans-serif';
  ctx.fillText('拼豆图纸', PAD, PAD);
  ctx.fillStyle='#6B7280'; ctx.font=subFs+'px sans-serif';
  ctx.fillText(W+' × '+H+' 格 · '+total+' 颗 · 正面 + 镜像（左右翻转）', PAD, PAD+titleFs+7);

  const drawLabel=(txt,ly)=>{
    ctx.fillStyle='#374151'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.font='600 '+labelFs+'px sans-serif'; ctx.fillText(txt, PAD, ly);
  };
  const drawSheet=(oy, mirror)=>{
    for(let r=0;r<H;r++) for(let c=0;c<W;c++){
      const v=grid[r][ mirror ? W-1-c : c];
      const x=PAD+c*s, y=oy+r*s;
      ctx.fillStyle=v?PAL[v]:'#FFFFFF'; ctx.fillRect(x,y,s,s);
      ctx.strokeStyle='#C9CDD3'; ctx.lineWidth=1;
      ctx.strokeRect(x+.5,y+.5,s-1,s-1);
      if(v && s>=16){
        ctx.fillStyle=LUM[v]>150?'rgba(0,0,0,.72)':'rgba(255,255,255,.94)';
        ctx.font='600 '+Math.round(s*0.34)+'px sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(v, x+s/2, y+s/2+s*0.02);
      }
    }
    fiveLines(ctx, PAD, oy, s, W, H);
    ctx.strokeStyle='#111827'; ctx.lineWidth=2;
    ctx.strokeRect(PAD+1, oy+1, gridW-2, gridH-2);
  };

  let y=PAD+headH;
  drawLabel('正面', y); y+=labelH;
  drawSheet(y,false); y+=gridH+gap;
  drawLabel('镜像（左右翻转）', y); y+=labelH;
  drawSheet(y,true); y+=gridH;

  // 图例
  if(lines.length){
    y+=gap;
    lines.forEach((ln,i)=>{
      let x=PAD; const ly=y+i*(lgFs+12);
      ln.items.forEach(it=>{
        ctx.fillStyle=PAL[it.e.code]||'#ccc'; ctx.fillRect(x, ly+2, chip, chip);
        ctx.strokeStyle='#D1D5DB'; ctx.lineWidth=1; ctx.strokeRect(x+.5, ly+2.5, chip-1, chip-1);
        ctx.fillStyle='#374151'; ctx.textAlign='left'; ctx.textBaseline='middle';
        ctx.font='600 '+lgFs+'px sans-serif';
        ctx.fillText(it.e.code+' ×'+it.e.n, x+chip+6, ly+2+chip/2);
        x+=it.w+itemGap;
      });
    });
  }
  drawFooter(ctx, cv, cvH-footH, footH, s);
  return cv;
}
function exportPattern(){
  const cv=buildPatternCanvas();
  downloadCanvas(cv, '拼豆图纸-'+W+'x'+H+'.png');
  toast('图纸已导出（正面 + 镜像）');
}

// ===== 输出预览图：圆点形式，不标色号 =====
function buildPreviewCanvas(){
  const total=beadTotal();
  let s=Math.max(8, Math.min(26, Math.floor(1500/Math.max(W,H))));
  const PAD=Math.max(24, Math.round(s*1.6));
  const titleFs=Math.max(16, Math.round(s*1.05)), subFs=Math.max(11, Math.round(s*0.62));
  const headH=titleFs+subFs+22;
  const footH=Math.max(46, s*2.2);
  const cvW=PAD*2+W*s, cvH=PAD+headH+H*s+PAD+footH;
  const {cv,ctx}=canvas2d(cvW,cvH);

  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='#111827'; ctx.font='700 '+titleFs+'px sans-serif';
  ctx.fillText('拼豆预览', PAD, PAD);
  ctx.fillStyle='#9CA3AF'; ctx.font=subFs+'px sans-serif';
  ctx.fillText(W+' × '+H+' 格 · '+total+' 颗', PAD, PAD+titleFs+6);

  const ox=PAD, oy=PAD+headH;
  for(let r=0;r<H;r++) for(let c=0;c<W;c++){
    const v=grid[r][c], cx=ox+c*s+s/2, cy=oy+r*s+s/2;
    if(!v){
      ctx.beginPath(); ctx.arc(cx,cy,s*0.4,0,7);
      ctx.strokeStyle='#EFF1F4'; ctx.lineWidth=Math.max(1,s*0.05); ctx.stroke();
      continue;
    }
    ctx.beginPath(); ctx.arc(cx,cy,s*0.44,0,7); ctx.fillStyle=PAL[v]; ctx.fill();
    ctx.beginPath(); ctx.arc(cx-s*0.13,cy-s*0.15,s*0.17,0,7); ctx.fillStyle='rgba(255,255,255,.45)'; ctx.fill();
  }
  drawFooter(ctx, cv, cvH-footH, footH, s);
  return cv;
}
function exportPreview(){
  const cv=buildPreviewCanvas();
  downloadCanvas(cv, '拼豆预览-'+W+'x'+H+'.png');
  toast('预览图已导出');
}
function showBill(){
  const cnt={};
  grid.forEach(row=>row.forEach(v=>{ if(v) cnt[v]=(cnt[v]||0)+1; }));
  const keys=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const total=keys.reduce((s,k)=>s+cnt[k],0);
  $('billList').innerHTML = keys.length
    ? '<div class="tip" style="margin:0 0 8px">共 '+total+' 颗，'+keys.length+' 种颜色</div>'
      + keys.map(k=>'<div class="brow"><div class="bsw" style="background:'+PAL[k]+'"></div><div class="bcode">'+k+'</div><div style="color:#888">'+PAL[k]+'</div><div style="margin-left:auto;font-weight:600">'+cnt[k]+' 颗</div></div>').join('')
    : '<div class="tip">画布是空的</div>';
  show('mBill');
}

/* ---------- 本机作品库 ---------- */
function works(){ try{ return JSON.parse(localStorage.getItem('pb_works')||'[]'); }catch(e){ return []; } }
function persist(){
  try{ localStorage.setItem('pb_current', JSON.stringify({W,H,code:genCode()})); }catch(e){}
}
function saveWork(){
  const name = ($('wname').value||'').trim() || ('作品 '+new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}));
  const list = works();
  const i = list.findIndex(x=>x.name===name);
  const item = {name, W, H, code:genCode(), ts:Date.now()};
  if(i>=0) list[i]=item; else list.unshift(item);
  try{ localStorage.setItem('pb_works', JSON.stringify(list)); }catch(e){ toast('保存失败（本地存储已满）'); return; }
  $('wname').value=''; renderWorks(); toast('已保存「'+name+'」');
}
function renderWorks(){
  const list=works();
  $('works').innerHTML = list.length ? list.map((w,i)=>
    '<div class="witem"><span class="wname" onclick="openWork('+i+')" title="'+w.name+' '+w.W+'x'+w.H+'">'+w.name+'</span>'+
    '<button onclick="openWork('+i+')">打开</button><button onclick="delWork('+i+')">×</button></div>').join('')
    : '<div style="font-size:11px;color:#AAA">暂无作品</div>';
}
function openWork(i){
  const w=works()[i]; if(!w) return;
  importCode(w.code);
  $('wname').value=w.name;
}
function delWork(i){
  const list=works(); const n=list[i].name;
  if(!confirm('删除「'+n+'」？')) return;
  list.splice(i,1); localStorage.setItem('pb_works', JSON.stringify(list)); renderWorks();
}
function importCode(code){
  $('impText').value=code; doImport();
}

const LOGOPAT = [["B20","B20","B20","B20","B20","B20","B20","B20"],["B20","B20","G14","B20","B20","G14","B20","B20"],["B20","B20","B20","B20","B20","B20","B20","B20"],["B20","G14","B20","G14","G14","B20","G14","B20"],["B20","B20","B20","G14","G14","B20","B20","B20"],["B20","B20","G14","G14","G14","G14","B20","B20"],["B20","B20","G14","G14","G14","G14","B20","B20"],["B20","B20","B20","B20","B20","B20","B20","B20"]];   // 站点头像图案（导出图水印用）
function showTpl(){
  const box = $('tplList');
  box.innerHTML = TPL.map((t,i)=>{
    const cnt = t.grid.flat().filter(Boolean).length;
    const cells = t.grid.map(row=>row.map(v=>v?'<b style="background:'+PAL[v]+'"></b>':'<b></b>').join('')).join('');
    return '<div class="tpl"><div class="tgrid" style="grid-template-columns:repeat('+t.grid[0].length+',6px)">'+cells+'</div>'+
      '<div style="flex:1"><div style="font-weight:600">'+t.name+'</div>'+
      '<div style="font-size:11px;color:#888">'+t.grid[0].length+'×'+t.grid.length+' 格 · '+cnt+' 颗</div></div>'+
      '<button class="primary" onclick="loadTpl('+i+')">打开</button></div>';
  }).join('');
  show('mTpl');
}
function loadTpl(i){
  const t = TPL[i];
  if(grid.flat().some(Boolean) && !confirm('载入「'+t.name+'」会替换当前画布内容，继续？')) return;
  hide('mTpl');
  // 模板数据只存了网格，现场生成编码文本走导入流程（自动改尺寸/入撤销栈/持久化）
  const code = t.grid.map(row=>row.map(v=>v||'.').join(' ')).join('\n');
  importCode(code);
  if(t.base){
    // 头套类模板已把小狼底图（露出+置顶）并入网格，关闭居中底图覆盖避免重复
    wolfOn = false; $('wolfOn').checked = false;
    buildBoard();
    toast('已载入模板「'+t.name+'」（含底图）');
  } else {
    toast('已载入模板「'+t.name+'」');
  }
}

/* ---------- 弹窗/提示 ---------- */
function show(id){ $(id).style.display='flex'; }
function hide(id){ $(id).style.display='none'; }
document.querySelectorAll('.mask').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.style.display='none'; }));
let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.style.opacity=1;
  clearTimeout(toastT); toastT=setTimeout(()=>t.style.opacity=0,1800);
}

/* ---------- 启动：恢复上次画布 ---------- */
let pendingRestore = null;   // 上次作品的待恢复数据
(function init(){
  buildPalette('');
  $('curSwatch').style.background=PAL[cur];
  try{
    const s=JSON.parse(localStorage.getItem('pb_current')||'null');
    if(s && s.code){
      const rows=s.code.split('\n').filter(l=>l.trim());
      const ok=rows.length && rows.every(l=>l.split(' ').every(v=>TOK.test(v)));
      if(ok) pendingRestore = {rows, w:Math.min(120,Math.max(5, s.W||rows[0].split(' ').length))};
    }
  }catch(e){}
  if(pendingRestore){
    $('resumeInfo').textContent = '检测到上次的作品（'+pendingRestore.w+' × '+pendingRestore.rows.length+' 格），要继续画还是新建画布？';
    setTimeout(()=>show('mResume'), 150);
  }
  // 底图默认显示；若用户上次主动关过则保持关闭
  let wantWolf = true;
  try{ wantWolf = localStorage.getItem('pb_wolf') !== '0'; }catch(e){}
  $('wolfOn').checked = wantWolf; wolfOn = wantWolf;
  buildBoard(); renderWorks();
})();
function resumeWork(){
  const {rows, w} = pendingRestore; pendingRestore = null;
  W = w; H = Math.min(120, Math.max(5, rows.length));
  grid = rows.map(l=>{ const t=l.split(' '); return Array.from({length:W},(_,c)=>{ const v=(t[c]||'.').toUpperCase(); return (v!=='.'&&PAL[v])?v:null; }); });
  $('inW').value=W; $('inH').value=H;
  hide('mResume'); buildBoard(); persist();
  toast('已恢复上次作品');
}
function freshStart(){
  pendingRestore = null;
  try{ localStorage.removeItem('pb_current'); }catch(e){}   // 明确放弃旧稿
  hide('mResume'); buildBoard();
  toast('已新建 52×52 画布');
}
